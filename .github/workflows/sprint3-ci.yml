name: Sprint 3 CI

on:
  push:
    branches:
      - main
      - codex/sprint-3-integration
  pull_request:

permissions:
  contents: read

concurrency:
  group: sprint3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend release gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate release scripts
        run: |
          node --check scripts/rehearse-sprint3-migrations.mjs
          node --check scripts/smoke-sprint3-api.mjs
          node --check scripts/smoke-sprint3-public.mjs
          node --check scripts/test-smoke-sprint3-public.mjs
          node --check scripts/sprint3-release.mjs
          node --check scripts/sprint3-schema-contract.mjs
          node --check scripts/verify-sprint3-integrity.mjs
          node --check scripts/verify-sprint3-schema.mjs
          npm run release:self-test:sprint3
          npm run release:test-smoke-public:sprint3

      - name: Run backend tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend release gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify pricing contract
        run: npm run test:pricing

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
